name: Candoa CI

on:
  push:
  pull_request:
  schedule:
    # Nightly full E2E suite on main so regressions surface without anyone
    # remembering to dispatch the lane (09:00 UTC ≈ 2am PT).
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      only_testing:
        description: >-
          Comma-separated -only-testing specs
          (e.g. CandoaUITests/CandoaUITests/testName) to restrict the E2E run
        required: false
        default: ""

permissions:
  contents: read

# The event name keeps long-running scheduled/dispatched E2E runs on main from
# being cancelled by unrelated pushes (and vice versa).
concurrency:
  group: candoa-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static Quality Gate
    runs-on: macos-latest
    # Targeted only_testing dispatches rerun a known-flaky test; skip the
    # quality/build gate there so the iteration loop stays tight.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.only_testing != '') }}

    steps:
      - name: Check out Candoa
        uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install quality tools
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi

      - name: Run quality checks
        run: Scripts/quality-check.sh

  build:
    name: Debug Build
    runs-on: macos-latest
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.only_testing != '') }}

    steps:
      - name: Check out Candoa
        uses: actions/checkout@v5

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build app
        run: |
          xcodebuild \
            -project Candoa.xcodeproj \
            -scheme Candoa \
            -configuration Debug \
            -destination platform=macOS \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            build

  e2e:
    name: Manual Native macOS E2E
    runs-on: macos-latest
    # Runs on manual dispatch and the nightly schedule. The needs results are
    # checked explicitly (instead of the implicit success() gate) so the job
    # still runs when quality/build were skipped for a targeted dispatch.
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') &&
      (needs.quality.result == 'success' || needs.quality.result == 'skipped') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    needs:
      - quality
      - build

    steps:
      - name: Check out Candoa
        uses: actions/checkout@v5

      - name: Show toolchain
        run: xcodebuild -version

      - name: Run XCTest UI suite
        env:
          CANDOA_E2E_ADHOC_SIGNING: "1"
          CANDOA_DERIVED_DATA_PATH: build/DerivedData
          CANDOA_E2E_ONLY_TESTING: ${{ inputs.only_testing }}
        run: Scripts/e2e-test.sh

      - name: Summarize test results
        if: always()
        run: Scripts/e2e-failure-summary.sh build/DerivedData/Logs/Test

      - name: Upload XCTest result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candoa-e2e-xcresult
          path: build/DerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
