name: Update Candoa Cloud Download

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  # Write so the workflow can push the release tag that anchors version bumps.
  contents: write

concurrency:
  group: update-candoa-cloud-download
  cancel-in-progress: true

jobs:
  build-and-update-cloud:
    name: Build DMG and update Candoa Cloud
    runs-on: macos-latest
    env:
      CLOUD_REPOSITORY: ${{ vars.CANDOA_CLOUD_REPOSITORY || 'aamancio/candoa-cloud' }}
      CLOUD_BRANCH: ${{ vars.CANDOA_CLOUD_BRANCH || 'main' }}
      APP_DMG: ${{ github.workspace }}/artifacts/Candoa.dmg
      APP_BUNDLE: ${{ github.workspace }}/build/DerivedData/Build/Products/Release/Candoa.app
      EXPECTED_APP_BUNDLE_IDENTIFIER: app.candoa.browser
      SPARKLE_VERSION: 2.9.3
      CODE_SIGN_IDENTITY: Developer ID Application

    steps:
      - name: Check out Candoa
        uses: actions/checkout@v5
        with:
          # Full history so the build number can be derived from the commit count.
          fetch-depth: 0

      - name: Derive build number and marketing version
        run: |
          echo "APP_BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

          # Marketing version: bump from conventional commits since the last
          # release tag. feat → minor, anything else → patch. The major digit
          # is never bumped automatically — 1.0 is a human decision, so
          # breaking-change markers (feat!, BREAKING CHANGE) are ignored.
          LAST_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          if [ -z "$LAST_TAG" ]; then
            # First tagged release: ship the version currently in the project.
            VERSION="$(sed -n 's/.*MARKETING_VERSION = \([0-9.]*\);.*/\1/p' Candoa.xcodeproj/project.pbxproj | head -1)"
          else
            BASE="${LAST_TAG#v}"
            MAJOR="${BASE%%.*}"; REST="${BASE#*.}"
            MINOR="${REST%%.*}"; PATCH="${REST#*.}"
            if git log --format=%s "$LAST_TAG..HEAD" | grep -qE '^feat(\(|!|:)'; then
              MINOR=$((MINOR + 1)); PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi
            VERSION="$MAJOR.$MINOR.$PATCH"
          fi
          echo "APP_MARKETING_VERSION=$VERSION" >> "$GITHUB_ENV"
          # The What's New generator turns commits since this tag into notes.
          echo "LAST_RELEASE_TAG=$LAST_TAG" >> "$GITHUB_ENV"
          echo "Version $VERSION (build $(git rev-list --count HEAD)), previous tag: ${LAST_TAG:-none}"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('Candoa.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Prepare signing keychain path
        run: echo "SIGNING_KEYCHAIN_PATH=$RUNNER_TEMP/candoa-signing.keychain-db" >> "$GITHUB_ENV"

      - name: Validate release signing secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID_PROVISIONING_PROFILE_BASE64: ${{ secrets.DEVELOPER_ID_PROVISIONING_PROFILE_BASE64 }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          missing=0
          for name in \
            APPLE_TEAM_ID \
            DEVELOPER_ID_CERTIFICATE_BASE64 \
            DEVELOPER_ID_CERTIFICATE_PASSWORD \
            DEVELOPER_ID_PROVISIONING_PROFILE_BASE64 \
            APPLE_NOTARY_KEY_BASE64 \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID
          do
            if [ -z "${!name}" ]; then
              echo "$name secret is required for Developer ID signing and notarization." >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-certificate.p12"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          printf '%s' "$DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$SIGNING_KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$SIGNING_KEYCHAIN_PATH"
          security list-keychains -d user -s "$SIGNING_KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$SIGNING_KEYCHAIN_PATH"

      - name: Install Developer ID provisioning profile
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEVELOPER_ID_PROVISIONING_PROFILE_BASE64: ${{ secrets.DEVELOPER_ID_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH="$RUNNER_TEMP/candoa-developer-id.provisionprofile"
          PROFILE_PLIST="$RUNNER_TEMP/candoa-developer-id.plist"

          printf '%s' "$DEVELOPER_ID_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"

          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILE_TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")"
          PROFILE_APP_IDENTIFIER="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' "$PROFILE_PLIST")"
          PROFILE_DISTRIBUTES_TO_ALL_DEVICES="$(/usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' "$PROFILE_PLIST")"

          if [ "$PROFILE_TEAM_ID" != "$APPLE_TEAM_ID" ]; then
            echo "Provisioning profile belongs to team $PROFILE_TEAM_ID, expected $APPLE_TEAM_ID." >&2
            exit 1
          fi
          if [ "$PROFILE_APP_IDENTIFIER" != "$APPLE_TEAM_ID.$EXPECTED_APP_BUNDLE_IDENTIFIER" ]; then
            echo "Provisioning profile is for $PROFILE_APP_IDENTIFIER, expected $APPLE_TEAM_ID.$EXPECTED_APP_BUNDLE_IDENTIFIER." >&2
            exit 1
          fi
          if [ "$PROFILE_DISTRIBUTES_TO_ALL_DEVICES" != "true" ]; then
            echo "Provisioning profile must be a Developer ID distribution profile." >&2
            exit 1
          fi
          if ! /usr/libexec/PlistBuddy \
            -c 'Print :Entitlements:com.apple.developer.associated-domains' \
            "$PROFILE_PLIST" >/dev/null 2>&1
          then
            echo "Provisioning profile must allow the Associated Domains capability." >&2
            exit 1
          fi
          PROFILE_ICLOUD_CONTAINER="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:com.apple.developer.icloud-container-identifiers:0' \
              "$PROFILE_PLIST" 2>/dev/null || true
          )"
          if [ "$PROFILE_ICLOUD_CONTAINER" != "iCloud.app.candoa.browser" ]; then
            echo "Provisioning profile must allow the iCloud.app.candoa.browser container." >&2
            exit 1
          fi
          if ! /usr/libexec/PlistBuddy \
            -c 'Print :Entitlements:com.apple.developer.icloud-services' \
            "$PROFILE_PLIST" >/dev/null 2>&1
          then
            echo "Provisioning profile must allow the iCloud/CloudKit service." >&2
            exit 1
          fi

          MOBILEDEVICE_PROFILE_DIRECTORY="$HOME/Library/MobileDevice/Provisioning Profiles"
          XCODE_PROFILE_DIRECTORY="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$MOBILEDEVICE_PROFILE_DIRECTORY" "$XCODE_PROFILE_DIRECTORY"
          cp "$PROFILE_PATH" "$MOBILEDEVICE_PROFILE_DIRECTORY/$PROFILE_UUID.provisionprofile"
          cp "$PROFILE_PATH" "$XCODE_PROFILE_DIRECTORY/$PROFILE_UUID.provisionprofile"
          echo "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Build Release app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -project Candoa.xcodeproj \
            -scheme Candoa \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_SPECIFIER" \
            MARKETING_VERSION="$APP_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$APP_BUILD_NUMBER" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            build

      - name: Re-sign Sparkle helpers
        run: |
          SPARKLE_FRAMEWORK="$APP_BUNDLE/Contents/Frameworks/Sparkle.framework"
          SPARKLE_VERSION="$SPARKLE_FRAMEWORK/Versions/B"
          APP_ENTITLEMENTS="build/DerivedData/Build/Intermediates.noindex/Candoa.build/Release/Candoa.build/Candoa.app.xcent"

          codesign --force --sign "$CODE_SIGN_IDENTITY" --timestamp --options runtime \
            "$SPARKLE_VERSION/Autoupdate"
          codesign --force --sign "$CODE_SIGN_IDENTITY" --timestamp --options runtime \
            "$SPARKLE_VERSION/XPCServices/Downloader.xpc"
          codesign --force --sign "$CODE_SIGN_IDENTITY" --timestamp --options runtime \
            "$SPARKLE_VERSION/XPCServices/Installer.xpc"
          codesign --force --sign "$CODE_SIGN_IDENTITY" --timestamp --options runtime \
            "$SPARKLE_VERSION/Updater.app"
          codesign --force --sign "$CODE_SIGN_IDENTITY" --timestamp --options runtime \
            "$SPARKLE_FRAMEWORK"
          codesign --force --sign "$CODE_SIGN_IDENTITY" --timestamp --options runtime \
            --entitlements "$APP_ENTITLEMENTS" \
            "$APP_BUNDLE"

      - name: Verify app signature
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"
          codesign --display --verbose=4 "$APP_BUNDLE"

      - name: Verify entitlement policy
        run: |
          SIGNED_ENTITLEMENTS="$(codesign -d --entitlements - --xml "$APP_BUNDLE")"
          printf '%s' "$SIGNED_ENTITLEMENTS" | plutil -p -
          # Sign in with Apple ships via the web flow only, so the native
          # capability must never reach the public artifact. The browser
          # passkey entitlement stays out until Apple assigns the managed
          # capability (#14 flips it to required after assignment).
          for FORBIDDEN in \
            "com.apple.developer.applesignin" \
            "com.apple.developer.web-browser.public-key-credential"; do
            if printf '%s' "$SIGNED_ENTITLEMENTS" | grep -F -q "$FORBIDDEN"; then
              echo "Forbidden entitlement $FORBIDDEN present in the signed app." >&2
              exit 1
            fi
          done

      - name: Package DMG
        run: |
          mkdir -p artifacts
          chmod +x Scripts/package_dmg.sh
          Scripts/package_dmg.sh \
            "$APP_BUNDLE" \
            "$APP_DMG"
          shasum -a 256 "$APP_DMG"

      - name: Sign, notarize, and staple DMG
        env:
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_NOTARY_KEY_ID.p8"
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"

          codesign --sign "$CODE_SIGN_IDENTITY" --timestamp "$APP_DMG"
          codesign --verify --verbose=2 "$APP_DMG"

          xcrun notarytool submit "$APP_DMG" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP_DMG"
          xcrun stapler validate "$APP_DMG"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$APP_DMG"

      - name: Validate app identity and read version
        run: |
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_BUNDLE/Contents/Info.plist")"
          APP_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_BUNDLE/Contents/Info.plist")"
          APP_BUNDLE_IDENTIFIER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_BUNDLE/Contents/Info.plist")"
          if [ "$APP_BUNDLE_IDENTIFIER" != "$EXPECTED_APP_BUNDLE_IDENTIFIER" ]; then
            echo "Expected bundle identifier $EXPECTED_APP_BUNDLE_IDENTIFIER, got $APP_BUNDLE_IDENTIFIER." >&2
            exit 1
          fi
          {
            echo "APP_VERSION=$APP_VERSION"
            echo "APP_BUILD=$APP_BUILD"
            echo "APP_BUNDLE_IDENTIFIER=$APP_BUNDLE_IDENTIFIER"
            echo "APP_FILE_NAME=Candoa $APP_VERSION.dmg"
            echo "APP_ARCHIVE_NAME=Candoa $APP_VERSION.dmg"
          } >> "$GITHUB_ENV"

      - name: Install Sparkle tools
        run: |
          SPARKLE_TOOLS="$RUNNER_TEMP/sparkle-tools"
          echo "SPARKLE_TOOLS=$SPARKLE_TOOLS" >> "$GITHUB_ENV"
          curl -L --fail \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz" \
            -o "$RUNNER_TEMP/Sparkle.tar.xz"
          mkdir -p "$SPARKLE_TOOLS"
          tar -xf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$SPARKLE_TOOLS" --strip-components=1
          "$SPARKLE_TOOLS/bin/generate_appcast" --help >/dev/null

      - name: Check out Candoa Cloud
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CLOUD_REPOSITORY }}
          ref: ${{ env.CLOUD_BRANCH }}
          ssh-key: ${{ secrets.CANDOA_CLOUD_DEPLOY_KEY }}
          path: CandoaCloud

      - name: Update Candoa Cloud download
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "SPARKLE_PRIVATE_KEY secret is required to sign Sparkle updates." >&2
            exit 1
          fi

          mkdir -p CandoaCloud/public/downloads
          cp "$APP_DMG" CandoaCloud/public/downloads/Candoa.dmg
          find CandoaCloud/public/downloads -maxdepth 1 -type f \( -name 'Candoa *.dmg' -o -name 'Candoa-*.dmg' \) -delete
          cp "$APP_DMG" "CandoaCloud/public/downloads/$APP_ARCHIVE_NAME"

          APPCAST_DIR="$(mktemp -d)"
          cp "$APP_DMG" "$APPCAST_DIR/$APP_ARCHIVE_NAME"
          cat > "$APPCAST_DIR/Candoa-$APP_VERSION.md" <<EOF
          # Candoa $APP_VERSION

          This update was generated automatically from Candoa commit ${GITHUB_SHA::7}.
          EOF
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_TOOLS/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://candoa.app/downloads/" \
            --link "https://candoa.app" \
            --maximum-versions 1 \
            --critical-update-version "" \
            --embed-release-notes \
            -o "$APPCAST_DIR/appcast.xml" \
            "$APPCAST_DIR"
          cp "$APPCAST_DIR/appcast.xml" CandoaCloud/public/downloads/appcast.xml

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "version": os.environ["APP_VERSION"],
              "build": os.environ["APP_BUILD"],
              "bundleIdentifier": os.environ["APP_BUNDLE_IDENTIFIER"],
              "fileName": os.environ["APP_FILE_NAME"],
              "downloadURL": f"https://candoa.app/downloads/{os.environ['APP_ARCHIVE_NAME']}",
              "stableDownloadURL": "https://candoa.app/downloads/Candoa.dmg",
              "archiveURL": f"https://candoa.app/downloads/{os.environ['APP_ARCHIVE_NAME']}",
              "appcastURL": "https://candoa.app/downloads/appcast.xml",
              "releaseNotesURL": "https://candoa.app/whats-new",
          }

          Path("CandoaCloud/public/downloads/latest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          rm -f CandoaCloud/public/downloads/Candoa.zip

      - name: Update Candoa Cloud What's New entry
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          version = os.environ["APP_VERSION"]
          last_tag = os.environ.get("LAST_RELEASE_TAG", "")

          range_spec = f"{last_tag}..HEAD" if last_tag else "HEAD"
          subjects = subprocess.run(
              ["git", "log", "--no-merges", "--format=%s", range_spec],
              capture_output=True, text=True, check=True,
          ).stdout.splitlines()

          conventional = re.compile(r"^(feat|fix|perf)(\([^)]*\))?!?:\s*(.+)$")
          feats, fixes = [], []
          for subject in subjects:
              match = conventional.match(subject.strip())
              if not match:
                  continue
              kind, _, text = match.groups()
              text = text.strip()
              text = text[0].upper() + text[1:]
              (feats if kind == "feat" else fixes).append(text)
          notes = feats + fixes or ["Maintenance and stability improvements."]

          entry = {
              "version": version,
              "date": datetime.now(timezone.utc).date().isoformat(),
              "notes": notes,
          }

          releases_path = Path("CandoaCloud/content/releases.json")
          releases = (
              json.loads(releases_path.read_text(encoding="utf-8"))
              if releases_path.exists()
              else []
          )
          # A re-run republishes the same version; replace instead of stacking.
          releases = [entry] + [r for r in releases if r["version"] != version]
          releases_path.parent.mkdir(parents=True, exist_ok=True)
          releases_path.write_text(
              json.dumps(releases, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(f"What's New entry for {version}: {len(notes)} note(s)")
          PY

      - name: Commit Candoa Cloud download
        working-directory: CandoaCloud
        run: |
          if [ -z "$(git status --porcelain -- public/downloads content/releases.json)" ]; then
            echo "Candoa download is unchanged; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads content/releases.json
          git commit -m "Update Candoa $APP_VERSION download from ${GITHUB_SHA::7}"
          git push origin "HEAD:$CLOUD_BRANCH"

      - name: Tag release
        run: |
          # Anchor for the next run's version bump; only reached when the
          # release actually published.
          if git rev-parse "v$APP_MARKETING_VERSION" >/dev/null 2>&1; then
            echo "Tag v$APP_MARKETING_VERSION already exists (re-run); leaving it."
            exit 0
          fi
          git tag "v$APP_MARKETING_VERSION" "$GITHUB_SHA"
          git push origin "v$APP_MARKETING_VERSION"
